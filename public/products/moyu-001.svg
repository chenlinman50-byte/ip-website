  <circle cx="98" cy="58" r="5" fill="#ffb5a5" opacity="0.5"/>
  <!-- Book -->
  <rect x="55" y="95" width="50" height="35" rx="3" fill="#5b9bd5" stroke="#4a8bc2" stroke-width="1"/>
  <path d="M80 95 L80 130" fill="none" stroke="#4a8bc2" stroke-width="1"/>
  <line x1="60" y1="102" x2="75" y2="102" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="108" x2="75" y2="108" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="114" x2="75" y2="114" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="85" y1="102" x2="100" y2="102" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="85" y1="108" x2="100" y2="108" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="85" y1="114" x2="100" y2="114" stroke="#fff" stroke-width="1" opacity="0.6"/>

  <circle cx="80" cy="55" r="28" fill="#f5f0e8" stroke="#d4b896" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="70" cy="50" rx="8" ry="9" fill="#fff"/>
  <circle cx="70" cy="51" r="4" fill="#4a2e1f"/>
  <circle cx="72" cy="49" r="1.5" fill="#fff"/>
  <ellipse cx="90" cy="50" rx="8" ry="9" fill="#fff"/>
  <circle cx="90" cy="51" r="4" fill="#4a2e1f"/>
  <circle cx="92" cy="49" r="1.5" fill="#fff"/>
